# mm — decide what's next, never when.
#
# Copy to ~/.mm/mm.toml and edit. Then: mm rules validate && mm onboard
#
# Four track types cover any kind of learning:
#   rotation  cycling window over a list (courses, papers, études, kata)
#   weekday   Mon–Sun table
#   static    same items every day
#   list      alias of static
#
# dominant = true → a gate. Gates lock the rest of the queue until done.

version = 2

[onboard]
strict_gate = true
order = ["books", "practice"]

[capacity.queue]
max = 14
on_full = "backlog"          # backlog | reject | warn

[capacity.stack]
max = 5
on_full = "reject"

[capacity.quick]
max = 50
on_full = "warn"

[rewards]
daily = "The rest of the evening is yours."

[rewards.streak_milestones]
"3" = "Three closed days. Tell someone."
"7" = "A week of finished loops."

# --- CS / courses ----------------------------------------------------------
# pages omitted = repeating daily checklist. mm done closes today's gate;
# the course stays in rotation until `mm book done <id>`.

[tracks.books]
type = "rotation"
source = "books"
count = 4
dominant = true
position = "gate"
label = "{value}"

# --- anything that isn't a book -------------------------------------------
# A rotation over plain items: papers, pieces, problems, languages.

[tracks.practice]
type = "rotation"
count = 1
dominant = true
position = "gate"
label = "{value}"
items = [
  "One focused session on the thing that matters",
]
