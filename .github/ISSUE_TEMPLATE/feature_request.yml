name: Feature request
description: Something mm cannot express yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        mm is a runtime box: queue, interrupt stack, quick. Nothing appears
        unless you typed `mm add`. Features that seed the day from a config
        file will be declined.

  - type: textarea
    id: decision
    attributes:
      label: What are you doing by hand today?
      description: The moment mm leaves you typing instead of working.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What you would type
      description: The command you wish existed.
      render: shell
