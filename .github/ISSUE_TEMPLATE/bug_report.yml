name: Bug report
description: mm did something wrong, or refused something it should have allowed.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what mm printed. Paste the output as-is.
      placeholder: |
        $ mm done
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Sequence matters. List the commands in order.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mm --version
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: macOS 15.3, Python 3.12.4

  - type: textarea
    id: state
    attributes:
      label: Relevant state (optional)
      description: >
        `mm export` and the shape of `~/.mm/state.json` help more than a
        paraphrase. Redact task names freely.
      render: json
