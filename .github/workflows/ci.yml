name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Test suite
        run: python -m unittest discover -s tests -v

      - name: No third-party imports crept in
        shell: bash
        run: |
          python -S -c "import mm.cli, mm.ops; print('stdlib-only ok')"

      - name: Install as a package and drive it end to end
        shell: bash
        run: |
          python -m pip install --quiet .
          export MM_HOME="$(mktemp -d)"
          mm --version
          mm status
          mm add "smoke test task"
          mm done
          mm undo
          mm stats
          mm export > /dev/null

      - name: Manual ships in the wheel
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import mm
          page = pathlib.Path(mm.__file__).parent / "data" / "mm.1"
          assert page.is_file(), "mm.1 missing from the installed package"
          assert page.read_text(encoding="utf-8").strip(), "mm.1 is empty"
          print("packaged data ok")
          PY
