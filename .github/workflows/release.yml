name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: The tag must match mm.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import mm; print(mm.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match mm.__version__ $pkg" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    # Publishing is opt-in: it only runs once a PyPI trusted publisher exists for
    # this repo, so the release job never fails on a repo without one configured.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
