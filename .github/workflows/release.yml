name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: The tag must match mm.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import mm; print(mm.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match mm.__version__ $pkg" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    # Genuinely opt-in. Without a PyPI trusted publisher this job cannot succeed,
    # so it stays skipped until you set the repository variable PYPI_ENABLED=true
    # (Settings -> Secrets and variables -> Actions -> Variables). Otherwise every
    # tag would leave a red run behind for a step that was never configured.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
