<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mm — 240x240 thumbnail</title>
<!-- Product Hunt feed thumbnail. Must stay legible at 40x40, so: one mark, no
     sentence. Rendered by site/tools/make-gallery.py. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 240px; height: 240px; overflow: hidden; }
  .t {
    width: 240px; height: 240px; background: #0b0d10;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .t::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 32% 26%, rgba(103,232,249,0.22), transparent 62%);
  }
  .m {
    position: relative; display: flex; align-items: baseline; gap: 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .caret { font-size: 56px; font-weight: 500; color: #67e8f9; line-height: 1; }
  .name { font-size: 76px; font-weight: 700; color: #f2f4f7; letter-spacing: -0.04em; line-height: 1; }
  .bar {
    position: absolute; left: 40px; right: 40px; bottom: 52px; height: 3px;
    background: #1e2229; border-radius: 2px; overflow: hidden;
  }
  .bar i { display: block; width: 34%; height: 100%; background: #67e8f9; }
</style>
</head>
<body>
  <div class="t">
    <div class="m"><span class="caret">&rarr;</span><span class="name">mm</span></div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
