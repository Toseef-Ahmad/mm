[project]
name = "mm-focus"
version = "2.0.0"
description = "Decide what's next. Never when. A CLI focus engine with queues, interrupts, and gates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Toseef Ahmad"}]
keywords = ["cli", "focus", "learning", "queue", "gtd"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.scripts]
mm = "mm.cli:main"

[project.urls]
Homepage = "https://github.com/Toseef-Ahmad/mm"
Repository = "https://github.com/Toseef-Ahmad/mm"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mm*"]

[tool.setuptools.package-data]
# The manual and the annotated config ship with the wheel, so `mm help` and
# `mm init` behave the same whether you pip-installed or cloned.
mm = ["data/mm.1", "data/mm.toml"]
